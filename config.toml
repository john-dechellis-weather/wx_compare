# Target path: .streamlit/config.toml
#
# BlueMet - Ops Black. Streamlit's own chrome (menus, popovers, the
# dataframe grid, dropdown panels) is drawn from these values, not from
# injected CSS, so they have to be set here or the widgets stay light.
#
# If this file already exists in the repo, merge these keys into it
# rather than replacing the whole file - it carries the static-serving
# switch the MRMS chunks depend on.

[theme]
base = "dark"
primaryColor = "#00E5FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0A0A0A"
textColor = "#FFFFFF"
font = "monospace"

[server]
# MRMS chunks and warmed CAM frames are served from static/.
# Do not turn this off.
enableStaticServing = true

[browser]
gatherUsageStats = false
