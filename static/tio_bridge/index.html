<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<script>
// BlueMet tio_bridge: relays {tio:'demand', value} messages from the
// map iframe (a sibling frame, same origin) to Streamlit as this
// component's value. Nothing is drawn; the frame is 0 px tall.
function send(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data || {}), "*");
}
window.addEventListener("message", function (ev) {
  var d = ev.data || {};
  if (d.tio === "demand" && d.value) {
    send("streamlit:setComponentValue", {value: d.value, dataType: "json"});
  }
});
send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 0});
</script></body></html>
